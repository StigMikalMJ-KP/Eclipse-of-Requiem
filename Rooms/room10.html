<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 10</title>

    <link rel="stylesheet" href="../CSS/map.css">
    <link rel="stylesheet" href="../CSS/Overlay.css">
    <link rel="stylesheet" href="../CSS/room9.css">

    <script type="module" src="../JS/inventory.js"></script>
    <script type="module" src="../JS/UI.js"></script>
    <script type="module" src="../JS/dialogue.js"></script>
    <script type="module" src="../JS/states.js"></script>
    <script type="module" src="../JS/interactables.js"></script>

    <!-- Bridge: expose module functions to window so mirrorRoom.js can reach them -->
    <script type="module">
        import { addToInventory, removeFromInventory, isInInventory, loadInventory } from "../JS/inventory.js";
        import { startDialogue } from "../JS/dialogue.js";
        window.addToInventory      = addToInventory;
        window.removeFromInventory = removeFromInventory;
        window.isInInventory       = isInInventory;
        window.loadInventory       = loadInventory;
        window.startDialogue       = startDialogue;
    </script>

    <!-- Room config must load before the shared mirror logic -->
    <script src="../JS/room10.js"></script>
    <script src="../JS/mirrorRoom.js"></script>
</head>
<body>
    <main id="container">
        <div id="room-stage">

            <!--
                Room 10 is room 9 flipped. Only the background images are mirrored —
                not the stage — so movement and coordinates stay correct.
            -->
            <style>
                #forrest, #map, #window-light,
                #mirror-overlay, #mirror-glass, #mirror { transform: scaleX(-1); }
            </style>

            <!-- BACKGROUND (same assets as room 9, flipped by CSS above) -->
            <img id="forrest" src="../Assets/Map/Room9/Purpleforrest.jpg">
            <img id="map"     src="../Assets/Map/room9/Frame9-Layer1.png">

            <!-- OVERLAYS -->
            <img id="window-light"   class="room-overlay" src="../Assets/Map/Room9/windowlight.png">
            <img id="mirror-overlay" class="room-overlay" src="../Assets/Map/Room9/MirrorBackground.png"               style="display: none;">
            <img id="mirror-glass"   class="room-overlay" src="../Assets/Map/Room9/MirrorBackgroundOverBackground.png"  style="display: none;">
            <img id="mirror"         class="room-overlay" src="../Assets/Map/Room9/Mirror.png"                          style="display: none;">

            <!-- PROMPT -->
            <div id="dynamic-z-prompt">
                <span class="z-key">[Z]</span>
                <span id="dynamic-z-text"></span>
            </div>

            <!-- TELEPORT VISUAL -->
            <div id="teleport-zone-room1" class="teleport-zone"></div>

        </div>
    </main>
    <script type="module" src="../JS/movement.js"></script>
</body>
</html>
